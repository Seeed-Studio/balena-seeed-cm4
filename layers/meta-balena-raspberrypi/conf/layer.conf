# the following overlays were added only for linux-raspberrypi so let's remove them for Revolution Pi boards which use linux-kunbus
KERNEL_DEVICETREE:remove:revpi = "overlays/hyperpixel4-pi3.dtbo overlays/hyperpixel4-pi4.dtbo overlays/hyperpixel4-square-pi3.dtbo overlays/hyperpixel4-square-pi4.dtbo"

# Weak default: machines with a PL011 debug UART (Seeed CM4 boards) set
# SERIAL_CONSOLES = "115200;ttyAMA0" in their machine conf, which would be
# clobbered by a hard assignment here.
SERIAL_CONSOLES ?= "115200;serial0"

# Name the Pi 5 debug UART directly so developmentMode gets a working getty
SERIAL_CONSOLES:raspberrypi5 = "115200;ttyAMA10"

# we should clean up all the following RPI_KERNEL_DEVICETREE changes when we switch to a newer meta-raspberrypi which contains a 6.x kernel
RPI_KERNEL_DEVICETREE ?= " \
    broadcom/bcm2708-rpi-zero.dtb \
    broadcom/bcm2708-rpi-zero-w.dtb \
    broadcom/bcm2708-rpi-b.dtb \
    broadcom/bcm2708-rpi-b-rev1.dtb \
    broadcom/bcm2708-rpi-b-plus.dtb \
    broadcom/bcm2709-rpi-2-b.dtb \
    broadcom/bcm2710-rpi-2-b.dtb \
    broadcom/bcm2710-rpi-3-b.dtb \
    broadcom/bcm2710-rpi-3-b-plus.dtb \
    broadcom/bcm2710-rpi-zero-2.dtb \
    broadcom/bcm2711-rpi-4-b.dtb \
    broadcom/bcm2711-rpi-400.dtb \
    broadcom/bcm2708-rpi-cm.dtb \
    broadcom/bcm2710-rpi-cm3.dtb \
    broadcom/bcm2711-rpi-cm4.dtb \
    broadcom/bcm2711-rpi-cm4s.dtb \
"

RPI_KERNEL_DEVICETREE:append:raspberrypi5 = " broadcom/bcm2712d0-rpi-5-b.dtb"
RPI_KERNEL_DEVICETREE:append:raspberrypi5 = " broadcom/bcm2712-rpi-500.dtb"
RPI_KERNEL_DEVICETREE:append:raspberrypi5 = " broadcom/bcm2712-rpi-cm5-cm4io.dtb"
RPI_KERNEL_DEVICETREE:append:raspberrypi5 = " broadcom/bcm2712-rpi-cm5-cm5io.dtb"
RPI_KERNEL_DEVICETREE:append:raspberrypi5 = " broadcom/bcm2712-rpi-cm5l-cm4io.dtb"
RPI_KERNEL_DEVICETREE:append:raspberrypi5 = " broadcom/bcm2712-rpi-cm5l-cm5io.dtb"

PREFERRED_VERSION_linux-raspberrypi = "6.12%"
# This is set to 6.1 in meta-raspberrypi's machine/raspberrypi5.conf
# and needs an explicit device override here to take effect
PREFERRED_VERSION_linux-raspberrypi:raspberrypi5 = "6.12%"

# Use the full version of cyfmac43455-sdio firmware to support WPA3
CYFMAC43455_SDIO_FIRMWARE = "standard"

FIRMWARE_COMPRESSION:raspberrypi4-64 ?= "1"
FIRMWARE_COMPRESSION:raspberrypi0-2w-64 ?= "1"

# avoid pseudo abort due to iwlwifi firmware being cleaned outside of fakeroot - this should be a temporary workaround until https://github.com/balena-os/meta-balena/pull/2270 is merged
IWLWIFI_FW_TOCLEAN:raspberrypi4-64 = ""
IWLWIFI_FW_TOCLEAN:raspberrypi0-2w-64 = ""

KERNEL_FEATURES:remove:revpi-connect-s = "cfg/fs/vfat.scc"
KERNEL_FEATURES:remove:revpi-connect-4 = "cfg/fs/vfat.scc"

# No cma parameter: the 320MiB CMA reservation from "vc4-kms-v3d,cma-320"
# leaves the 1GiB CM4 boards without enough usable memory and the kernel
# dies at entry (silent after "Starting kernel ...").
VC4DTBO = "vc4-kms-v3d"

# The split wrynose layout (separate openembedded-core / meta-yocto
# layers) no longer ships meta-poky's global source MIRRORS list, so any
# upstream hiccup fails the build with no fallback. Concretely: zlib.net
# intermittently sits behind a Cloudflare JS challenge that serves an
# HTML page instead of the tarball to datacenter IPs, and the checksum
# failure then aborts do_fetch outright ("Checksum failure fetching
# https://zlib.net/zlib-1.3.2.tar.gz"). Restore the classic
# source-mirror fallback chain (the same servers the Yocto Project
# autobuilder mirrors to).
MIRRORS:prepend = " \
    https://.*/. https://downloads.yoctoproject.org/mirror/sources/ \n \
    https://.*/. http://sources.openembedded.org/ \n \
    http://.*/. https://downloads.yoctoproject.org/mirror/sources/ \n \
"

# --- Seeed CM4 machines: balenaOS deltas ---------------------------------
# The seeed-* machines are defined by the meta-seeed-cm4 submodule
# (layers/meta-seeed-cm4, meta-balena branch), which stays pure board
# support. Everything balenaOS-specific that used to live in this layer's
# seeed-* machine confs is expressed here as machine-scoped deltas instead
# (the meta-seeed-rockchip / balena-seeed-rockchip pattern: the BSP layer
# owns the machines, this delta layer owns the balena integration glue).
#
# seeed-recomputer-r22 still has its machine conf in this layer (it is the
# only machine meta-seeed-cm4 does not define yet) and carries its own
# balena bits; it moves to the same scheme once a plain machine conf lands
# on meta-seeed-cm4 main.

# These CM4 boards boot via the self-contained rpi-u-boot-scr boot.cmd,
# which loads the raw kernel image from the FAT boot partition with booti.
# Pin the machine-scoped image type: the local.conf template pins
# KERNEL_IMAGETYPE:raspberrypi4-64 to "Image.gz" and wins over unscoped
# assignments, but a machine-scoped override is more specific and wins
# over that (rerouter deliberately keeps the default flow and is not
# pinned here).
KERNEL_IMAGETYPE:seeed-recomputer-r100x = "Image"
KERNEL_IMAGETYPE:seeed-recomputer-r110x = "Image"
KERNEL_IMAGETYPE:seeed-reterminal = "Image"
KERNEL_IMAGETYPE:seeed-reterminal-DM = "Image"

IMAGE_INSTALL:append:seeed-recomputer-r100x = " userlandtools"
IMAGE_INSTALL:append:seeed-recomputer-r110x = " userlandtools"
IMAGE_INSTALL:append:seeed-reterminal = " userlandtools"
IMAGE_INSTALL:append:seeed-reterminal-DM = " userlandtools"
IMAGE_INSTALL:append:seeed-rerouter-cm4 = " userlandtools"

# Debug UART is the PL011 (ttyAMA0) wired to the Type-C CH343 debug port;
# serial0 would resolve to the pinless mini-UART and leave the console and
# getty silent (config.txt disables Bluetooth so the PL011 is free).
SERIAL_CONSOLES:seeed-recomputer-r100x = "115200;ttyAMA0"
SERIAL_CONSOLES:seeed-recomputer-r110x = "115200;ttyAMA0"
SERIAL_CONSOLES:seeed-reterminal = "115200;ttyAMA0"
CMDLINE_SERIAL:seeed-recomputer-r100x = "console=ttyAMA0,115200"
CMDLINE_SERIAL:seeed-recomputer-r110x = "console=ttyAMA0,115200"
CMDLINE_SERIAL:seeed-reterminal = "console=ttyAMA0,115200"

# Device tree overlays built by the meta-seeed-cm4 seeed-linux-dtoverlays
# recipe are staged from its deploy dir onto the boot partition (the
# r100x overlay ships under the short dot-free "r100x-v11" alias because
# the boot firmware uses dotted dtoverlay names verbatim and silently
# drops overlong config.txt lines).
BALENA_BOOT_PARTITION_FILES:append:seeed-recomputer-r100x = " r100x-v11.dtbo:/overlays/r100x-v11.dtbo"
BALENA_BOOT_PARTITION_FILES:append:seeed-recomputer-r110x = " reComputer-R110x.dtbo:/overlays/reComputer-R110x.dtbo"
BALENA_BOOT_PARTITION_FILES:append:seeed-reterminal = " reTerminal.dtbo:/overlays/reTerminal.dtbo"
BALENA_BOOT_PARTITION_FILES:append:seeed-reterminal-DM = " reTerminal-DM.dtbo:/overlays/reTerminal-DM.dtbo"

# ... together with the raw kernel bundle the machine-specific boot.cmd
# loads (u-boot cannot be relied on to resolve the rootfs volume symlink
# chain where the kernel normally lives). reterminal-DM names the
# initramfs bundle directly.
BALENA_BOOT_PARTITION_FILES:append:seeed-recomputer-r100x = " ${IMAGE_ROOTFS}/boot/${KERNEL_IMAGETYPE}:/Image"
BALENA_BOOT_PARTITION_FILES:append:seeed-recomputer-r110x = " ${IMAGE_ROOTFS}/boot/${KERNEL_IMAGETYPE}:/Image"
BALENA_BOOT_PARTITION_FILES:append:seeed-reterminal = " ${IMAGE_ROOTFS}/boot/${KERNEL_IMAGETYPE}:/Image"
BALENA_BOOT_PARTITION_FILES:append:seeed-reterminal-DM = " Image-initramfs-${MACHINE}.bin:/Image"

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS:append:seeed-recomputer-r100x = " seeed-linux-dtoverlays"
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS:append:seeed-recomputer-r110x = " seeed-linux-dtoverlays"
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS:append:seeed-reterminal = " seeed-linux-dtoverlays"
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS:append:seeed-reterminal-DM = " seeed-linux-dtoverlays"
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS:append:seeed-rerouter-cm4 = " seeed-linux-dtoverlays"

# seeed-recomputer-r2x (Pi5-based): balena-bootloader boot flow instead of
# u-boot + boot.scr.
BALENA_BOOT_PARTITION_FILES:remove:seeed-recomputer-r2x = " u-boot.bin:/${SDIMG_KERNELIMAGE} boot.scr:/boot.scr "
BALENA_BOOT_PARTITION_FILES:append:seeed-recomputer-r2x = " \
    balena-bootloader/${KERNEL_IMAGETYPE}-initramfs-${MACHINE}.bin:/${SDIMG_KERNELIMAGE} \
    balena-bootloader/bootenv:/bootenv \
    "
BALENA_BOOT_PARTITION_FILES:append:seeed-recomputer-r2x = " reComputer-R2x-base.dtbo:/overlays/reComputer-R2x-base.dtbo reComputer-R21.dtbo:/overlays/reComputer-R21.dtbo "
PREFERRED_PROVIDER_virtual/balena-bootloader:seeed-recomputer-r2x = "linux-balena-bootloader"
IMAGE_INSTALL:append:seeed-recomputer-r2x = " grub-editenv userlandtools hailo-firmware"
HOSTAPP_HOOKS:remove:seeed-recomputer-r2x = " 99-resin-uboot 999-resin-boot-cleaner"
HOSTAPP_HOOKS:append:seeed-recomputer-r2x = " 99-balena-bootloader"

# seeed-reterminal-DM: the machine name carries uppercase letters ("DM");
# docker tags must be lowercase and OE treats an uppercase PN as a QA error.
IMAGE_MACHINE_SUFFIX:seeed-reterminal-DM = "-seeed-reterminal-dm"
ERROR_QA:remove:seeed-reterminal-DM = "uppercase-pn"
