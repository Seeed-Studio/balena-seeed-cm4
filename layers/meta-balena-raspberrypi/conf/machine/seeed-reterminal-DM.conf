#@TYPE: Machine
#@NAME: Seeed reterminal plus
#@SOC: broadcom bcm2711
#@DESCRIPTION: Machine configuration for seeed reterminal DM
#@MAINTAINER: jian xiong <953308023@qq.com>

MACHINEOVERRIDES = "raspberrypi4-64:${MACHINE}"
require conf/machine/raspberrypi4-64.conf

# Ensure correct kernel image type for aarch64
KERNEL_IMAGETYPE = "Image"
# local.conf pins KERNEL_IMAGETYPE:raspberrypi4-64 to "Image.gz", which wins
# over the plain assignment above; the self-contained boot.cmd loads /Image
# with booti and needs an uncompressed kernel, so pin it with a
# machine-scoped override.
KERNEL_IMAGETYPE:seeed-reterminal-DM = "Image"

# Docker repository names must be lowercase; keep image artifact names
# lowercase as well (machine name contains upper-case "DM")
IMAGE_MACHINE_SUFFIX = "-seeed-reterminal-dm"

# Increase initramfs maxsize to 40 MiB for this device
IMAGE_ROOTFS_MAXSIZE = "40960"


IMAGE_INSTALL:append = " userlandtools"
# Add kernel device tree overlays from kernel source
RPI_KERNEL_DEVICETREE_OVERLAYS:append = " overlays/i2c3.dtbo \ 
overlays/vc4-kms-v3d-pi4.dtbo"

# Add device tree overlays from seeed-linux-dtoverlays package to boot partition
BALENA_BOOT_PARTITION_FILES:append = " reTerminal-DM.dtbo:/overlays/reTerminal-DM.dtbo"

# Kernel bundle staged on the FAT boot partition and loaded by the
# machine-specific rpi-u-boot-scr boot.cmd.
BALENA_BOOT_PARTITION_FILES:append = " Image-initramfs-${MACHINE}.bin:/Image"
PACKAGECONFIG:append:pn-qtbase = " eglfs "
KERNEL_MODULE_AUTOLOAD:rpi += "i2c-dev"
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += "seeed-linux-dtoverlays"

# Ensure seeed-linux-dtoverlays is deployed before balena-image build
do_resin_boot_dirgen_and_deploy[depends] += "seeed-linux-dtoverlays:do_deploy"
ENABLE_I2C = "1"
ENABLE_UART = "1"

# The machine name (and hence PN of meta-environment-* recipes) contains
# uppercase letters, which newer OE treats as a fatal QA error at parse
# time (uppercase-pn). The slug is a published balena device type, so
# renaming to lowercase is not an option; drop just that check instead.
ERROR_QA:remove = "uppercase-pn"
