#@TYPE: Machine
#@NAME: Seeed reComputer-R100x
#@SOC: broadcom bcm2711
#@DESCRIPTION: Machine configuration for seeed reComputer-R100x
#@MAINTAINER: ruiqian tang <ruiqian.tang@seeed.cc>

MACHINEOVERRIDES = "raspberrypi4-64:${MACHINE}"
include conf/machine/raspberrypi4-64.conf

# Ensure correct kernel image type for aarch64
KERNEL_IMAGETYPE = "Image"

# The wrynose local.conf template pins KERNEL_IMAGETYPE:raspberrypi4-64
# to "Image.gz"; that override silently wins over the plain assignment
# above (local.conf parses after the machine conf), renaming the
# deployed kernel bundle to Image.gz-initramfs-${MACHINE}.bin. This
# board's self-contained boot flow stages the raw uncompressed Image
# and boots it with booti, so pin the machine-scoped override (more
# specific than :raspberrypi4-64, so it wins over the local.conf one).
KERNEL_IMAGETYPE:seeed-recomputer-r100x = "Image"

# Increase initramfs maxsize to 40 MiB for this device
IMAGE_ROOTFS_MAXSIZE = "40960"

IMAGE_INSTALL:append = " userlandtools"

RPI_KERNEL_DEVICETREE_OVERLAYS:append = " overlays/i2c0.dtbo \ 
overlays/i2c1.dtbo overlays/i2c3.dtbo overlays/i2c6.dtbo"

# Add device tree overlays from seeed-linux-dtoverlays package to boot partition.
# The boot firmware treats a dotted dtoverlay name as a complete filename (it
# does not append .dtbo) and silently drops overlong config.txt dtoverlay
# lines, so the v1.1 overlay is shipped under the short, dot-free alias
# "r100x-v11" (see seeed-linux-dtoverlays.bb) and referenced by that name.
BALENA_BOOT_PARTITION_FILES:append = " r100x-v11.dtbo:/overlays/r100x-v11.dtbo"

# Kernel bundle staged on the FAT boot partition and loaded by the
# machine-specific rpi-u-boot-scr boot.cmd (u-boot cannot be relied on to
# resolve the rootfs volume symlink chain where the kernel normally lives).
BALENA_BOOT_PARTITION_FILES:append = " ${IMAGE_ROOTFS}/boot/${KERNEL_IMAGETYPE}:/Image"

# The Type-C CH343 debug port is wired to GPIO14/15 and uses the PL011
# (ttyAMA0). As on reTerminal/R110x, config.txt disables Bluetooth so the
# PL011 is available to the kernel console and the serial getty.
SERIAL_CONSOLES = "115200;ttyAMA0"
CMDLINE_SERIAL = "console=ttyAMA0,115200"
KERNEL_MODULE_AUTOLOAD:rpi += "i2c-dev"
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += "seeed-linux-dtoverlays"

# Ensure seeed-linux-dtoverlays is deployed before balena-image build
do_resin_boot_dirgen_and_deploy[depends] += "seeed-linux-dtoverlays:do_deploy"
ENABLE_I2C = "1"
ENABLE_UART = "1"