name: build-all-seeed-boards

on:
  workflow_dispatch:
    inputs:
      build_type:
        type: choice
        description: 'Build type for all machines'
        options:
          - development
          - production
        default: 'production'
      tag_name:
        description: 'Release tag to publish images to (release is created if missing; empty = no release upload)'
        required: false
        default: ''
        type: string

jobs:
  Build-all-images:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Create release
        # Idempotent: reuse the release if it already exists so re-runs of
        # this workflow (e.g. after a timed-out board) keep appending assets.
        if: ${{ inputs.tag_name != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if gh release view "$TAG_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, reusing it"
            exit 0
          fi
          gh release create "$TAG_NAME" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Release $TAG_NAME" \
            --notes "# balena Image Build for SEEED Boards
          **Build Information:**
          - Commit: \`${GITHUB_SHA}\`
          - Branch: \`${GITHUB_REF_NAME}\`
          - Build type: \`${{ inputs.build_type }}\`

          **Files:**
          Each board uploads its \`<machine>-image.tar.gz\` asset to this
          release as soon as its build completes.

          **Installation:**
          Flash the .img file to an SD card or eMMC storage using balenaEtcher or dd."

      - name: Dispatch all-boards build
        # The per-board workflow builds every machine as a parallel matrix
        # when machine=all, and uploads the release assets itself. A single
        # dispatch avoids the shared concurrency group cancelling sibling
        # runs, and keeps this job well under the 6h job limit.
        uses: benc-uk/workflow-dispatch@v1.1
        with:
          workflow: seeed-balena-boards-build
          token: ${{ secrets.GITHUB_TOKEN }}
          inputs: >-
            {
              "machine": "all",
              "build_type": "${{ inputs.build_type }}",
              "tag_name": "${{ inputs.tag_name }}"
            }
