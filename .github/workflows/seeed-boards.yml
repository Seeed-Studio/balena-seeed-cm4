name: seeed-balena-boards-build

on:
  workflow_dispatch:
    inputs:
      machine:
        description: Board to build
        required: true
        type: choice
        options:
          - all
          - seeed-recomputer-r100x
          - seeed-recomputer-r110x
          - seeed-rerouter-cm4
          - seeed-reterminal
          - seeed-reterminal-DM
          - seeed-recomputer-r2x
          - seeed-recomputer-r22
        default: seeed-recomputer-r100x
      build_type:
        description: Image type
        required: true
        type: choice
        options:
          - development
          - production
        default: development
      tag_name:
        description: Release tag to publish images to (release is created if missing)
        required: false
        type: string
        default: ''
      disable_upload_downloads:
        description: Disable uploading the shared downloads cache after single-machine builds
        required: false
        type: boolean
        default: true

concurrency:
  group: balena-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: en_US.UTF-8
  VERBOSE: "1"

jobs:
  build:
    name: ${{ matrix.machine }}
    runs-on: ubuntu-24.04
    # Cold full builds on the 4-vCPU public runner can take several hours;
    # 360 min is the GitHub Actions job maximum.
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.machine != 'all') && format('["{0}"]', inputs.machine) || '["seeed-recomputer-r100x", "seeed-recomputer-r110x", "seeed-rerouter-cm4", "seeed-reterminal", "seeed-reterminal-DM", "seeed-recomputer-r2x", "seeed-recomputer-r22"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Free up runner disk space
        run: |
          # Strip the large preinstalled toolchains and images the Yocto
          # build never uses. Tolerate missing packages.
          sudo apt-get remove -yq \
            '^dotnet-.*' '^llvm-.*' 'php.*' \
            azure-cli google-cloud-sdk firefox google-chrome-stable \
            powershell mono-complete > /dev/null 2>&1 || true
          sudo apt-get autoremove -y > /dev/null 2>&1 || true
          sudo apt-get clean
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" \
            /usr/local/lib/android /usr/local/share/boost \
            /usr/share/dotnet /usr/share/swift \
            /opt/ghc /usr/local/.ghcup
          # Preloaded container images (~3 GiB); nothing in this job uses docker.
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h /

      - name: Install Yocto host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential chrpath cpio diffstat file gawk git \
            git-lfs iputils-ping jq libacl1 libegl1 lz4 libsdl2-dev \
            mesa-common-dev pylint python3 python3-git python3-jinja2 \
            python3-pexpect python3-subunit socat texinfo unzip \
            wget xterm xz-utils zstd locales
          # Some layer scripts expect bash as /bin/sh.
          sudo rm -f /bin/sh && sudo ln -s bash /bin/sh

      - name: Enable BitBake user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          version: v1.67.0
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: Download sstate cache
        run: |
          rclone copy -P --stats 1m \
            "seeed-storage:yocto-cache/balenaos-latest/${{ matrix.machine }}.sstate-cache.tar" . \
            --transfers 8 --checkers 8 --fast-list --ignore-existing || true
          if [ -f "${{ matrix.machine }}.sstate-cache.tar" ]; then
            mkdir -p build/sstate-cache
            tar --no-same-owner -xf "${{ matrix.machine }}.sstate-cache.tar" -C build/sstate-cache
            rm -f "${{ matrix.machine }}.sstate-cache.tar"
            echo "sstate cache restored for ${{ matrix.machine }}"
          else
            echo "no sstate cache for ${{ matrix.machine }}, cold build"
          fi
          df -h /

      - name: Download shared downloads cache
        run: |
          rclone copy -P --stats 1m \
            "seeed-storage:yocto-cache/balenaos-latest/yocto-download.tar" . \
            --transfers 8 --checkers 8 --fast-list --ignore-existing || true
          if [ -f yocto-download.tar ]; then
            mkdir -p build/downloads
            tar --no-same-owner -xf yocto-download.tar -C build/downloads
            rm -f yocto-download.tar
            echo "downloads cache restored"
          else
            echo "no shared downloads cache"
          fi
          df -h /

      - name: Build balenaOS image
        env:
          BALENA_DEVICE_TYPE: ${{ matrix.machine }}
        run: |
          if [ "${{ inputs.build_type }}" = "development" ]; then
            BUILD_OPTIONS="-d"
          else
            BUILD_OPTIONS=""
          fi
          ./balena-yocto-scripts/build/barys --dry-run $BUILD_OPTIONS
          source layers/poky/oe-init-build-env
          MACHINE=${{ matrix.machine }} bitbake balena-image
          df -h /

      - name: Upload deploy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: balena-${{ matrix.machine }}
          path: build/tmp/deploy/images/${{ matrix.machine }}/
          if-no-files-found: error
          retention-days: 14

      - name: Prepare updated sstate cache
        run: |
          if [ -f layers/poky/scripts/sstate-cache-management.py ]; then
            if [ -d build/tmp/stamps ]; then
              python3 layers/poky/scripts/sstate-cache-management.py -y -v \
                --cache-dir=build/sstate-cache \
                --stamps-dir=build/tmp/stamps \
                || echo "WARNING: unused-sstate cleanup failed"
            fi
            python3 layers/poky/scripts/sstate-cache-management.py -y -v \
              --cache-dir=build/sstate-cache \
              --remove-duplicated \
              || echo "WARNING: duplicate-sstate cleanup failed"
          else
            echo "sstate-cache-management.py not found, skipping cleanup"
          fi
          rm -rf build/tmp/work
          if [ -d build/sstate-cache ] && [ -n "$(ls -A build/sstate-cache)" ]; then
            tar --format=posix --sort=name --mtime=0 -cf \
              "updated-${{ matrix.machine }}.sstate-cache.tar" \
              -C build/sstate-cache .
            ls -lh "updated-${{ matrix.machine }}.sstate-cache.tar"
          else
            echo "no sstate cache to upload"
          fi
          df -h /

      - name: Upload sstate cache
        run: |
          if [ -f "updated-${{ matrix.machine }}.sstate-cache.tar" ]; then
            rclone copyto -P --stats 1m \
              "updated-${{ matrix.machine }}.sstate-cache.tar" \
              "seeed-storage:yocto-cache/balenaos-latest/${{ matrix.machine }}.sstate-cache.tar" \
              --update
            echo "sstate cache uploaded for ${{ matrix.machine }}"
          else
            echo "no sstate cache file to upload"
          fi

      - name: Prepare updated downloads cache
        if: ${{ !inputs.disable_upload_downloads && inputs.machine != 'all' }}
        run: |
          if [ -d build/downloads ] && [ -n "$(ls -A build/downloads)" ]; then
            tar --format=posix --sort=name --mtime=0 -cf updated-yocto-download.tar \
              -C build/downloads .
            ls -lh updated-yocto-download.tar
            df -h /
          else
            echo "no downloads to upload"
          fi

      - name: Upload downloads cache
        if: ${{ !inputs.disable_upload_downloads && inputs.machine != 'all' }}
        run: |
          if [ -f updated-yocto-download.tar ]; then
            rclone copyto -P --stats 1m updated-yocto-download.tar \
              "seeed-storage:yocto-cache/balenaos-latest/yocto-download.tar" \
              --update
            echo "downloads cache uploaded"
          else
            echo "no downloads file to upload"
          fi

      - name: Upload release assets
        if: ${{ inputs.tag_name != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag_name }}"
          # Create the release if it does not exist yet; tolerate a
          # concurrent matrix job winning the race.
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
                 --target "$GITHUB_SHA" --title "$TAG" \
                 --notes "Automated balenaOS build @ ${GITHUB_SHA}" \
            || true
          DEPLOY="build/tmp/deploy/images/${{ matrix.machine }}"
          if [ ! -d "$DEPLOY" ]; then
            echo "ERROR: deploy dir $DEPLOY not found"
            exit 1
          fi
          tar --format=posix --sort=name --mtime=0 -czf "${{ matrix.machine }}-image.tar.gz" \
            -C "$DEPLOY" .
          ls -lh "${{ matrix.machine }}-image.tar.gz"
          gh release upload "$TAG" "${{ matrix.machine }}-image.tar.gz" --clobber -R "$GITHUB_REPOSITORY"
