name: seeed-balena-boards-build

# Every run is a clean build: nothing is restored from earlier runs.
#
# A cold balenaOS build of one board takes 3.5-5.5 h on a 4-vCPU hosted
# runner (runner speed varies ~1.5x), so building each board from
# scratch in its own job keeps hitting the 6 h job limit. The work is
# split in two stages instead, sharing results only inside this run:
#
#   1. toolchain: builds every -native recipe of balena-image once,
#      including the serial rust-llvm-native -> rust-native ->
#      cargo-native chain that is the critical path of a cold build.
#      Native task signatures are identical for every seeed machine
#      (checked rpi4 vs rpi5 with bitbake -S none), so its sstate is
#      handed to all boards as a run-scoped artifact.
#   2. build: one job per board restores that sstate and builds only
#      the target packages, kernel and image.

on:
  workflow_dispatch:
    inputs:
      machine:
        description: Board to build
        required: true
        type: choice
        options:
          - all
          - seeed-recomputer-r100x
          - seeed-recomputer-r110x
          - seeed-rerouter-cm4
          - seeed-reterminal
          - seeed-reterminal-DM
          - seeed-recomputer-r2x
          - seeed-recomputer-r22
        default: seeed-recomputer-r100x
      build_type:
        description: Image type
        required: true
        type: choice
        options:
          - development
          - production
        default: development
      tag_name:
        description: Release tag to publish images to (release is created if missing)
        required: false
        type: string
        default: ''

concurrency:
  # Per machine, so dispatching two single-board builds back to back does
  # not cancel the first one.
  group: balena-${{ github.workflow }}-${{ github.ref }}-${{ inputs.machine }}
  cancel-in-progress: true

env:
  LANG: en_US.UTF-8
  VERBOSE: "1"
  # Machine used to configure the toolchain stage. Any seeed machine
  # works: -native signatures do not depend on MACHINE.
  TOOLCHAIN_MACHINE: seeed-recomputer-r100x

jobs:
  toolchain:
    name: toolchain (native)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Yocto build
        uses: ./.github/actions/yocto-setup
        with:
          build_type: ${{ inputs.build_type }}

      - name: Build native toolchains
        timeout-minutes: 330
        run: |
          source layers/openembedded-core/oe-init-build-env
          # List every recipe balena-image needs and keep the -native
          # ones. Natives only depend on natives, so this builds no
          # target code. bitbake -g writes its output to the cwd.
          mkdir -p "$RUNNER_TEMP/depgraph"
          (cd "$RUNNER_TEMP/depgraph" && MACHINE=$TOOLCHAIN_MACHINE bitbake -g balena-image)
          NATIVES=$(grep -- '-native$' "$RUNNER_TEMP/depgraph/pn-buildlist" | sort -u)
          echo "Building $(echo "$NATIVES" | wc -l) native recipes"
          MACHINE=$TOOLCHAIN_MACHINE bitbake $NATIVES
          du -sh sstate-cache
          df -h /

      - name: Pack the native sstate
        # upload-artifact rejects file names containing ':' (NTFS
        # portability), and every sstate object is named
        # sstate:<pn>:...:<hash>_<task>.tar.zst, so ship one tarball.
        # No compression: the sstate objects are already zstd-compressed.
        # hashserv.db carries the hash-equivalence mapping so the board
        # jobs resolve exactly the same sstate objects.
        run: |
          shopt -s nullglob
          cd build
          tar -cf "$RUNNER_TEMP/sstate-native.tar" sstate-cache cache/hashserv.db*
          ls -lh "$RUNNER_TEMP/sstate-native.tar"

      - name: Hand the native sstate to the board jobs
        # Run-scoped: board jobs of this run (and their re-runs) download
        # it; later runs never see it, so every run stays a clean build.
        uses: actions/upload-artifact@v4
        with:
          name: sstate-native
          path: ${{ runner.temp }}/sstate-native.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  build:
    name: ${{ matrix.machine }}
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.machine != 'all') && format('["{0}"]', inputs.machine) || '["seeed-recomputer-r100x", "seeed-recomputer-r110x", "seeed-rerouter-cm4", "seeed-reterminal", "seeed-reterminal-DM", "seeed-recomputer-r2x", "seeed-recomputer-r22"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Yocto build
        uses: ./.github/actions/yocto-setup
        with:
          build_type: ${{ inputs.build_type }}

      - name: Download this run's native sstate
        uses: actions/download-artifact@v4
        with:
          name: sstate-native
          path: ${{ runner.temp }}/sstate-native

      - name: Unpack the native sstate
        run: |
          tar -xf "$RUNNER_TEMP/sstate-native/sstate-native.tar" -C build
          rm -f "$RUNNER_TEMP/sstate-native/sstate-native.tar"
          ls -l build/cache/

      - name: Build balenaOS image
        timeout-minutes: 330
        env:
          BALENA_DEVICE_TYPE: ${{ matrix.machine }}
        run: |
          du -sh build/sstate-cache
          source layers/openembedded-core/oe-init-build-env
          MACHINE=${{ matrix.machine }} bitbake balena-image
          df -h /

      - name: Upload deploy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: balena-${{ matrix.machine }}
          path: build/tmp/deploy/images/${{ matrix.machine }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload release assets
        if: ${{ inputs.tag_name != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag_name }}"
          # Create the release if it does not exist yet; tolerate a
          # concurrent matrix job winning the race.
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
                 --target "$GITHUB_SHA" --title "$TAG" \
                 --notes "Automated balenaOS build @ ${GITHUB_SHA}" \
            || true
          DEPLOY="build/tmp/deploy/images/${{ matrix.machine }}"
          if [ ! -d "$DEPLOY" ]; then
            echo "ERROR: deploy dir $DEPLOY not found"
            exit 1
          fi
          tar --format=posix --sort=name --mtime=0 -czf "${{ matrix.machine }}-image.tar.gz" \
            -C "$DEPLOY" .
          ls -lh "${{ matrix.machine }}-image.tar.gz"
          gh release upload "$TAG" "${{ matrix.machine }}-image.tar.gz" --clobber -R "$GITHUB_REPOSITORY"
