name: seeed-balena-boards-build

on:
  workflow_dispatch:
    inputs:
      machine:
        description: Board to build
        required: true
        type: choice
        options:
          - all
          - seeed-recomputer-r100x
          - seeed-recomputer-r110x
          - seeed-rerouter-cm4
          - seeed-reterminal
          - seeed-reterminal-DM
          - seeed-recomputer-r2x
          - seeed-recomputer-r22
        default: seeed-recomputer-r100x
      build_type:
        description: Image type
        required: true
        type: choice
        options:
          - development
          - production
        default: development
      tag_name:
        description: Release tag to publish images to (release is created if missing)
        required: false
        type: string
        default: ''

concurrency:
  group: balena-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: en_US.UTF-8
  VERBOSE: "1"

jobs:
  build:
    name: ${{ matrix.machine }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.machine != 'all') && format('["{0}"]', inputs.machine) || '["seeed-recomputer-r100x", "seeed-recomputer-r110x", "seeed-rerouter-cm4", "seeed-reterminal", "seeed-reterminal-DM", "seeed-recomputer-r2x", "seeed-recomputer-r22"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Free up runner disk space
        run: |
          # Strip the large preinstalled toolchains and images the Yocto
          # build never uses. Tolerate missing packages.
          sudo apt-get remove -yq \
            '^dotnet-.*' '^llvm-.*' 'php.*' \
            azure-cli google-cloud-sdk firefox google-chrome-stable \
            powershell mono-complete > /dev/null 2>&1 || true
          sudo apt-get autoremove -y > /dev/null 2>&1 || true
          sudo apt-get clean
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" \
            /usr/local/lib/android /usr/local/share/boost \
            /usr/share/dotnet /usr/share/swift \
            /opt/ghc /usr/local/.ghcup
          # Preloaded container images (~3 GiB); nothing in this job uses docker.
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h /

      - name: Install Yocto host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential chrpath cpio diffstat file gawk git \
            git-lfs iputils-ping jq libacl1 libegl1 lz4 libsdl2-dev \
            mesa-common-dev pylint python3 python3-git python3-jinja2 \
            python3-pexpect python3-subunit socat texinfo unzip \
            wget xterm xz-utils zstd locales
          # Some layer scripts expect bash as /bin/sh.
          sudo rm -f /bin/sh && sudo ln -s bash /bin/sh

      - name: Enable BitBake user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Restore Yocto sstate cache
        uses: actions/cache/restore@v4
        with:
          path: build/sstate-cache
          key: balena-${{ matrix.machine }}-sstate-${{ github.sha }}
          restore-keys: |
            balena-${{ matrix.machine }}-sstate-

      - name: Build balenaOS image
        # Cap below the 360 min job maximum so the sstate banking steps
        # below run in a live job instead of the post-cancellation
        # grace window. A cold build may hit this on purpose: the sstate
        # saved below lets the next run converge.
        timeout-minutes: 330
        env:
          BALENA_DEVICE_TYPE: ${{ matrix.machine }}
        run: |
          if [ "${{ inputs.build_type }}" = "development" ]; then
            BUILD_OPTIONS="-d"
          else
            BUILD_OPTIONS=""
          fi
          ./balena-yocto-scripts/build/barys --dry-run $BUILD_OPTIONS
          source layers/poky/oe-init-build-env
          MACHINE=${{ matrix.machine }} bitbake balena-image
          df -h /

      - name: Upload deploy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: balena-${{ matrix.machine }}
          path: build/tmp/deploy/images/${{ matrix.machine }}/
          if-no-files-found: error
          retention-days: 14

      - name: Prepare sstate cache for save
        # Shrink below the 10 GiB per-cache limit before saving; runs even
        # on failure/budget-stop so partial progress is banked.
        if: always()
        run: |
          if [ -f layers/poky/scripts/sstate-cache-management.py ]; then
            if [ -d build/tmp/stamps ]; then
              python3 layers/poky/scripts/sstate-cache-management.py -y -v \
                --cache-dir=build/sstate-cache \
                --stamps-dir=build/tmp/stamps \
                || echo "WARNING: unused-sstate cleanup failed"
            fi
            python3 layers/poky/scripts/sstate-cache-management.py -y -v \
              --cache-dir=build/sstate-cache \
              --remove-duplicated \
              || echo "WARNING: duplicate-sstate cleanup failed"
          else
            echo "sstate-cache-management.py not found, skipping cleanup"
          fi
          rm -rf build/tmp/work 2>/dev/null || true
          du -sh build/sstate-cache || true
          df -h /

      - name: Save Yocto sstate cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/sstate-cache
          key: balena-${{ matrix.machine }}-sstate-${{ github.sha }}

      - name: Upload release assets
        if: ${{ inputs.tag_name != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag_name }}"
          # Create the release if it does not exist yet; tolerate a
          # concurrent matrix job winning the race.
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
                 --target "$GITHUB_SHA" --title "$TAG" \
                 --notes "Automated balenaOS build @ ${GITHUB_SHA}" \
            || true
          DEPLOY="build/tmp/deploy/images/${{ matrix.machine }}"
          if [ ! -d "$DEPLOY" ]; then
            echo "ERROR: deploy dir $DEPLOY not found"
            exit 1
          fi
          tar --format=posix --sort=name --mtime=0 -czf "${{ matrix.machine }}-image.tar.gz" \
            -C "$DEPLOY" .
          ls -lh "${{ matrix.machine }}-image.tar.gz"
          gh release upload "$TAG" "${{ matrix.machine }}-image.tar.gz" --clobber -R "$GITHUB_REPOSITORY"
